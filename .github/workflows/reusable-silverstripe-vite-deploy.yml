name: Reusable Silverstripe Vite deployment

on:
  workflow_call:
    inputs:
      should_deploy:
        description: Build and deploy the release artifact.
        required: false
        type: boolean
        default: false
      theme_directory:
        description: Theme directory containing package.json and the Vite dist output.
        required: false
        type: string
        default: themes/netwerkstatt
      frontend_artifact_name:
        description: Artifact containing the Vite output produced by the CI job.
        required: false
        type: string
        default: silverstripe-vite-dist
      ddev_directory:
        description: Directory containing the DDEV project configuration used to select runtime versions.
        required: false
        type: string
        default: .
      deployment_environment:
        description: GitHub Environment holding the target variables and deployment secrets.
        required: false
        type: string
        default: production
      deploy_stage:
        description: Deployer host stage name.
        required: false
        type: string
        default: live
      deployer_version:
        description: Deployer PHAR version used by deployphp/action.
        required: false
        type: string
        default: '8.0.5'
      artifact_name:
        description: Name of the packaged release artifact.
        required: false
        type: string
        default: silverstripe-release
    secrets:
      DEPLOYER_PRIVATE_KEY:
        required: false
      DEPLOYER_KNOWN_HOSTS:
        required: false

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    outputs:
      php_version: ${{ steps.runtime.outputs.php_version }}
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@v7

      - name: Read PHP version from DDEV config
        id: runtime
        env:
          PROJECT_DIRECTORY: ${{ inputs.ddev_directory }}
        run: |
          ruby -r yaml -e '
            config = YAML.safe_load_file(File.join(ENV.fetch("PROJECT_DIRECTORY"), ".ddev/config.yaml"))
            php_version = config.fetch("php_version").to_s

            abort "Unsupported PHP version in .ddev/config.yaml: #{php_version}" unless php_version.match?(/\A\d+\.\d+\z/)

            File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
              output.puts "php_version=#{php_version}"
            end
          '

      - name: Download frontend build from CI
        if: inputs.should_deploy
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.frontend_artifact_name }}
          path: build-artifact/frontend

      - name: Package source and Vite assets
        if: inputs.should_deploy
        env:
          DDEV_DIRECTORY: ${{ inputs.ddev_directory }}
          THEME_DIRECTORY: ${{ inputs.theme_directory }}
        run: |
          if [[ "$DDEV_DIRECTORY" == /* || "$DDEV_DIRECTORY" == *..* ]] || \
            [[ "$THEME_DIRECTORY" == /* || "$THEME_DIRECTORY" == *..* ]]; then
            echo "DDEV and theme directories must be relative paths without parent traversal." >&2
            exit 1
          fi

          THEME_SOURCE_PATH="$THEME_DIRECTORY"
          if [[ "$DDEV_DIRECTORY" != "." ]]; then
            THEME_SOURCE_PATH="$DDEV_DIRECTORY/$THEME_DIRECTORY"
          fi
          if [[ ! -d build-artifact/frontend ]]; then
            echo "Frontend artifact is missing or empty." >&2
            exit 1
          fi

          mkdir -p build-artifact/package
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C build-artifact/package
          mkdir -p "build-artifact/package/$THEME_SOURCE_PATH/dist"
          cp -a build-artifact/frontend/. "build-artifact/package/$THEME_SOURCE_PATH/dist/"
          if [[ ! -s "build-artifact/package/$THEME_SOURCE_PATH/dist/.vite/manifest.json" ]]; then
            echo "Vite manifest missing from release package." >&2
            exit 1
          fi
          tar -czf build-artifact/release.tar.gz -C build-artifact/package .

      - name: Upload the release artifact
        if: inputs.should_deploy
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: build-artifact/release.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: inputs.should_deploy
    needs: build-and-package
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.deployment_environment }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ inputs.deployment_environment }}
      cancel-in-progress: false
    env:
      DEPLOY_STAGE: ${{ inputs.deploy_stage }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_PHP_BIN: ${{ vars.DEPLOY_PHP_BIN }}
      DEPLOY_COMPOSER_COMMAND: ${{ vars.DEPLOY_COMPOSER_COMMAND }}
      DEPLOY_ARCHIVE: ${{ github.workspace }}/build-artifact/release.tar.gz
    steps:
      - name: Check out the deployment recipe
        uses: actions/checkout@v7

      - name: Download the release artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: build-artifact

      - name: Set up PHP for Deployer
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ needs.build-and-package.outputs.php_version }}
          tools: none

      - name: Verify PHP version matches DDEV config
        env:
          EXPECTED_PHP_VERSION: ${{ needs.build-and-package.outputs.php_version }}
        run: |
          actual_php_version="$(php -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')"
          if [[ "$actual_php_version" != "$EXPECTED_PHP_VERSION" ]]; then
            echo "PHP mismatch: DDEV requests $EXPECTED_PHP_VERSION, runner has $actual_php_version" >&2
            exit 1
          fi
          php --version

      - name: Check deployment configuration
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          DEPLOYER_KNOWN_HOSTS: ${{ secrets.DEPLOYER_KNOWN_HOSTS }}
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_PHP_BIN DEPLOYER_PRIVATE_KEY DEPLOYER_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required GitHub Environment variable or secret is missing: $name" >&2
              exit 1
            fi
          done
          test -s "$DEPLOY_ARCHIVE"

      - name: Deploy with Deployer
        uses: deployphp/action@a1b46c204dbde25a32ed0d7bb6751ac3377ca1e9 # v1.0.26
        with:
          dep: deploy
          recipe: deploy.php
          deployer-version: ${{ inputs.deployer_version }}
          php-binary: php
          private-key: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          known-hosts: ${{ secrets.DEPLOYER_KNOWN_HOSTS }}
          verbosity: -vvv
